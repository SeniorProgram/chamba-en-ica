# Importador de Empleos Perú (MTPE) en GitHub: corre solo todos los días, aunque la PC esté apagada.
# A diferencia de SERVIR, Empleos Perú sí acepta las conexiones de GitHub.
# Abre (o actualiza) un Pull Request con las ofertas nuevas para revisarlas antes de publicarlas.
name: Importar ofertas de Empleos Perú

on:
  schedule:
    - cron: "0 13 * * *" # 8:00 a. m. hora de Perú (13:00 UTC); GitHub puede demorar unos minutos
  workflow_dispatch: # y también a mano con el botón "Run workflow"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: importar-empleosperu
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Buscar ofertas nuevas de Ica en Empleos Perú
        run: node scripts/importar-empleosperu.mjs

      - name: Abrir Pull Request para revisar
        uses: peter-evans/create-pull-request@v8
        with:
          branch: importar/empleosperu
          delete-branch: true
          title: "Ofertas nuevas de Ica (Empleos Perú)"
          body-path: data/ultimo-importe-empleosperu.md
          commit-message: "Importa ofertas nuevas de Empleos Perú (MTPE)"
          labels: importado
          add-paths: |
            content/ofertas/*.md
            public/img/empresas/*
            data/empleosperu-vistos.json
