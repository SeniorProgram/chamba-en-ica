# Importador de Talento Perú (SERVIR) en GitHub. OJO: SERVIR rechaza (403) las conexiones de GitHub,
# así que el importe diario se hace desde la PC con importar-convocatorias.bat (ver README).
# Se deja solo con el botón "Run workflow" por si SERVIR lo permite en el futuro.
name: Importar convocatorias de SERVIR

on:
  workflow_dispatch: # solo a mano (botón "Run workflow")

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: importar-servir
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Buscar convocatorias nuevas en Talento Perú
        run: node scripts/importar-servir.mjs

      - name: Abrir Pull Request para revisar
        uses: peter-evans/create-pull-request@v8
        with:
          branch: importar/servir
          delete-branch: true
          title: "Convocatorias nuevas de Ica (Talento Perú)"
          body-path: data/ultimo-importe.md
          commit-message: "Importa convocatorias nuevas de Talento Perú (SERVIR)"
          labels: importado
          add-paths: |
            content/ofertas/*.md
            data/servir-vistos.json
