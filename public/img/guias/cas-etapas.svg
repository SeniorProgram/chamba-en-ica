<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Las 5 etapas de una convocatoria CAS: postulación, evaluación curricular, evaluación de conocimientos, entrevista personal y resultados</title>
<rect width="1200" height="560" rx="28" fill="#eef3fb"/>
<text x="600" y="78" text-anchor="middle" font-size="40" font-weight="800" fill="#0b3d91">Las etapas de una convocatoria CAS</text>
<line x1="150" y1="250" x2="1050" y2="250" stroke="#d6e0f0" stroke-width="10" stroke-linecap="round"/>
<circle cx="150" cy="250" r="62" fill="#0b3d91" stroke="#fff" stroke-width="8"/><text x="150" y="268" text-anchor="middle" font-size="50" font-weight="800" fill="#fff">1</text>
  <text x="150" y="365" text-anchor="middle" font-size="27" font-weight="800" fill="#0f1b2d">Postulación</text><text x="150" y="402" text-anchor="middle" font-size="25" font-weight="500" fill="#5b6b82">Envías tu</text><text x="150" y="436" text-anchor="middle" font-size="25" font-weight="500" fill="#5b6b82">expediente</text><circle cx="375" cy="250" r="62" fill="#0b3d91" stroke="#fff" stroke-width="8"/><text x="375" y="268" text-anchor="middle" font-size="50" font-weight="800" fill="#fff">2</text>
  <text x="375" y="365" text-anchor="middle" font-size="27" font-weight="800" fill="#0f1b2d">Evaluación</text><text x="375" y="402" text-anchor="middle" font-size="25" font-weight="500" fill="#5b6b82">curricular</text><text x="375" y="436" text-anchor="middle" font-size="25" font-weight="500" fill="#5b6b82">(puntaje)</text><circle cx="600" cy="250" r="62" fill="#1d5bbf" stroke="#fff" stroke-width="8"/><text x="600" y="268" text-anchor="middle" font-size="50" font-weight="800" fill="#fff">3</text>
  <text x="600" y="365" text-anchor="middle" font-size="27" font-weight="800" fill="#0f1b2d">Conocimientos</text><text x="600" y="402" text-anchor="middle" font-size="25" font-weight="500" fill="#5b6b82">o examen</text><text x="600" y="436" text-anchor="middle" font-size="25" font-weight="500" fill="#5b6b82">técnico*</text><circle cx="825" cy="250" r="62" fill="#0b3d91" stroke="#fff" stroke-width="8"/><text x="825" y="268" text-anchor="middle" font-size="50" font-weight="800" fill="#fff">4</text>
  <text x="825" y="365" text-anchor="middle" font-size="27" font-weight="800" fill="#0f1b2d">Entrevista</text><text x="825" y="402" text-anchor="middle" font-size="25" font-weight="500" fill="#5b6b82">personal</text><text x="825" y="436" text-anchor="middle" font-size="25" font-weight="500" fill="#5b6b82"></text><circle cx="1050" cy="250" r="62" fill="#16a34a" stroke="#fff" stroke-width="8"/><text x="1050" y="268" text-anchor="middle" font-size="50" font-weight="800" fill="#fff">5</text>
  <text x="1050" y="365" text-anchor="middle" font-size="27" font-weight="800" fill="#0f1b2d">Resultados</text><text x="1050" y="402" text-anchor="middle" font-size="25" font-weight="500" fill="#5b6b82">y firma del</text><text x="1050" y="436" text-anchor="middle" font-size="25" font-weight="500" fill="#5b6b82">contrato</text>
<rect x="250" y="470" width="700" height="62" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/>
<text x="600" y="512" text-anchor="middle" font-size="25" font-weight="700" fill="#ea580c">⚠ Cada etapa es eliminatoria · *solo en algunos procesos</text></svg>
