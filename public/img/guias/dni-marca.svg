<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Ejemplo de copia de DNI marcada con el texto: solo para postulación, nombre de la empresa y fecha</title>
<rect width="1200" height="560" rx="28" fill="#eef3fb"/>
<text x="600" y="66" text-anchor="middle" font-size="38" font-weight="800" fill="#0b3d91">Marca siempre la copia de tu DNI</text>
<g transform="rotate(-3 600 300)">
  <rect x="300" y="110" width="600" height="360" rx="24" fill="#fff" stroke="#d6e0f0" stroke-width="3"/>
  <rect x="300" y="110" width="600" height="66" rx="24" fill="#1d5bbf"/><rect x="300" y="150" width="600" height="26" fill="#1d5bbf"/>
  <text x="600" y="155" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">DOCUMENTO NACIONAL DE IDENTIDAD</text>
  <rect x="340" y="205" width="150" height="190" rx="14" fill="#eef3fb"/>
  <circle cx="415" cy="275" r="36" fill="#94a3b8"/><path d="M355 395 q0 -70 60 -70 q60 0 60 70Z" fill="#94a3b8"/>
  <rect x="525" y="220" width="320" height="18" rx="9" fill="#d6e0f0"/><rect x="525" y="264" width="230" height="18" rx="9" fill="#d6e0f0"/><rect x="525" y="308" width="320" height="18" rx="9" fill="#d6e0f0"/><rect x="525" y="352" width="230" height="18" rx="9" fill="#d6e0f0"/>
</g>
<g transform="rotate(-14 600 300)" opacity=".85">
  <text x="600" y="290" text-anchor="middle" font-size="44" font-weight="800" fill="#dc2626">SOLO PARA POSTULACIÓN</text>
  <text x="600" y="345" text-anchor="middle" font-size="36" font-weight="700" fill="#dc2626">Empresa X · 29/10/2026</text>
</g>
<text x="600" y="520" text-anchor="middle" font-size="25" font-weight="600" fill="#5b6b82">Escribe encima sin tapar los datos: para qué es, para quién y la fecha</text></svg>
