<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Estructura de un CV en 6 partes: datos de contacto, perfil, formación, experiencia o proyectos, cursos y habilidades</title>
<rect width="1200" height="700" rx="28" fill="#eef3fb"/>
<rect x="80" y="50" width="420" height="600" rx="22" fill="#fff" stroke="#d6e0f0" stroke-width="3"/>
<circle cx="160" cy="130" r="44" fill="#eef3fb"/><circle cx="160" cy="118" r="18" fill="#1d5bbf"/><path d="M128 160 q32 -40 64 0Z" fill="#1d5bbf"/>
<rect x="225" y="105" width="220" height="20" rx="10" fill="#0b3d91"/><rect x="225" y="138" width="150" height="14" rx="7" fill="#d6e0f0"/>
<rect x="120" y="215" width="110" height="14" rx="7" fill="#f97316"/><rect x="120" y="240" width="340" height="11" rx="5" fill="#d6e0f0"/><rect x="120" y="260" width="240" height="11" rx="5" fill="#d6e0f0"/><rect x="120" y="300" width="150" height="14" rx="7" fill="#f97316"/><rect x="120" y="325" width="340" height="11" rx="5" fill="#d6e0f0"/><rect x="120" y="345" width="200" height="11" rx="5" fill="#d6e0f0"/><rect x="120" y="385" width="110" height="14" rx="7" fill="#f97316"/><rect x="120" y="410" width="340" height="11" rx="5" fill="#d6e0f0"/><rect x="120" y="430" width="160" height="11" rx="5" fill="#d6e0f0"/><rect x="120" y="470" width="150" height="14" rx="7" fill="#f97316"/><rect x="120" y="495" width="340" height="11" rx="5" fill="#d6e0f0"/><rect x="120" y="515" width="240" height="11" rx="5" fill="#d6e0f0"/><rect x="120" y="555" width="110" height="14" rx="7" fill="#f97316"/><rect x="120" y="580" width="340" height="11" rx="5" fill="#d6e0f0"/><rect x="120" y="600" width="200" height="11" rx="5" fill="#d6e0f0"/>
<circle cx="590" cy="108" r="30" fill="#0b3d91"/><text x="590" y="118" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">1</text>
  <text x="640" y="104" text-anchor="start" font-size="30" font-weight="800" fill="#0f1b2d">Datos de contacto</text><text x="640" y="140" text-anchor="start" font-size="24" font-weight="500" fill="#5b6b82">Nombre, celular, correo, ciudad</text><circle cx="590" cy="208" r="30" fill="#f97316"/><text x="590" y="218" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">2</text>
  <text x="640" y="204" text-anchor="start" font-size="30" font-weight="800" fill="#0f1b2d">Perfil</text><text x="640" y="240" text-anchor="start" font-size="24" font-weight="500" fill="#5b6b82">3 o 4 líneas: quién eres y qué buscas</text><circle cx="590" cy="308" r="30" fill="#f97316"/><text x="590" y="318" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">3</text>
  <text x="640" y="304" text-anchor="start" font-size="30" font-weight="800" fill="#0f1b2d">Formación</text><text x="640" y="340" text-anchor="start" font-size="24" font-weight="500" fill="#5b6b82">Carrera, instituto o colegio, fechas</text><circle cx="590" cy="408" r="30" fill="#f97316"/><text x="590" y="418" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">4</text>
  <text x="640" y="404" text-anchor="start" font-size="30" font-weight="800" fill="#0f1b2d">Experiencia o proyectos</text><text x="640" y="440" text-anchor="start" font-size="24" font-weight="500" fill="#5b6b82">Prácticas, voluntariados, trabajos</text><circle cx="590" cy="508" r="30" fill="#f97316"/><text x="590" y="518" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">5</text>
  <text x="640" y="504" text-anchor="start" font-size="30" font-weight="800" fill="#0f1b2d">Cursos y certificaciones</text><text x="640" y="540" text-anchor="start" font-size="24" font-weight="500" fill="#5b6b82">Con horas y entidad</text><circle cx="590" cy="608" r="30" fill="#f97316"/><text x="590" y="618" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">6</text>
  <text x="640" y="604" text-anchor="start" font-size="30" font-weight="800" fill="#0f1b2d">Habilidades</text><text x="640" y="640" text-anchor="start" font-size="24" font-weight="500" fill="#5b6b82">Programas e idiomas con nivel real</text></svg>
