<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Pago en el régimen agrario: remuneración diaria, CTS y gratificaciones incluidas, más el bono BETA de 30 % del sueldo mínimo</title>
<rect width="1200" height="560" rx="28" fill="#eef3fb"/>
<text x="600" y="72" text-anchor="middle" font-size="38" font-weight="800" fill="#0b3d91">Qué incluye tu pago en el régimen agrario</text>
<rect x="60" y="120" width="250" height="220" rx="20" fill="#1d5bbf" stroke="none" stroke-width="3"/><text x="185" y="215" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">Remuneración</text><text x="185" y="258" text-anchor="middle" font-size="25" font-weight="600" fill="#e0e7ff">diaria</text><text x="325" y="240" text-anchor="middle" font-size="48" font-weight="800" fill="#f97316">+</text><rect x="340" y="120" width="250" height="220" rx="20" fill="#0b3d91" stroke="none" stroke-width="3"/><text x="465" y="215" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">CTS</text><text x="465" y="258" text-anchor="middle" font-size="25" font-weight="600" fill="#e0e7ff">incluida*</text><text x="605" y="240" text-anchor="middle" font-size="48" font-weight="800" fill="#f97316">+</text><rect x="620" y="120" width="250" height="220" rx="20" fill="#0b3d91" stroke="none" stroke-width="3"/><text x="745" y="215" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">Gratificaciones</text><text x="745" y="258" text-anchor="middle" font-size="25" font-weight="600" fill="#e0e7ff">incluidas*</text><text x="885" y="240" text-anchor="middle" font-size="48" font-weight="800" fill="#f97316">+</text><rect x="900" y="120" width="250" height="220" rx="20" fill="#16a34a" stroke="none" stroke-width="3"/><text x="1025" y="215" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">Bono BETA</text><text x="1025" y="258" text-anchor="middle" font-size="25" font-weight="600" fill="#e0e7ff">30 % del mínimo</text>
<rect x="160" y="380" width="880" height="70" rx="20" fill="#fff" stroke="#d6e0f0" stroke-width="3"/><text x="600" y="425" text-anchor="middle" font-size="28" font-weight="700" fill="#0f1b2d">Todo debe aparecer detallado en tu boleta de pago</text>
<text x="600" y="510" text-anchor="middle" font-size="24" font-weight="500" fill="#5b6b82">*Suelen pagarse prorrateadas en el jornal. Revisa tu boleta.</text></svg>
