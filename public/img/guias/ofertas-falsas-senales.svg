<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Las 8 señales de alerta de una oferta de trabajo falsa</title>
<rect width="1200" height="640" rx="28" fill="#eef3fb"/>
<text x="600" y="72" text-anchor="middle" font-size="40" font-weight="800" fill="#dc2626">8 señales de que la oferta es falsa</text>
<rect x="60" y="120" width="255" height="220" rx="20" fill="#fff" stroke="#fecaca" stroke-width="3"/><circle cx="187" cy="198" r="50" fill="#fee2e2"/><text x="187" y="216" text-anchor="middle" font-size="48" font-weight="400" fill="#0f1b2d">💸</text>
  <circle cx="94" cy="154" r="20" fill="#dc2626"/><text x="94" y="163" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">1</text>
  <text x="187" y="300" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1b2d">Te piden dinero</text><rect x="335" y="120" width="255" height="220" rx="20" fill="#fff" stroke="#fecaca" stroke-width="3"/><circle cx="462" cy="198" r="50" fill="#fee2e2"/><text x="462" y="216" text-anchor="middle" font-size="48" font-weight="400" fill="#0f1b2d">🤑</text>
  <circle cx="369" cy="154" r="20" fill="#dc2626"/><text x="369" y="163" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">2</text>
  <text x="462" y="300" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1b2d">Sueldo muy alto</text><rect x="610" y="120" width="255" height="220" rx="20" fill="#fff" stroke="#fecaca" stroke-width="3"/><circle cx="737" cy="198" r="50" fill="#fee2e2"/><text x="737" y="216" text-anchor="middle" font-size="48" font-weight="400" fill="#0f1b2d">❓</text>
  <circle cx="644" cy="154" r="20" fill="#dc2626"/><text x="644" y="163" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">3</text>
  <text x="737" y="288" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1b2d">Sin nombre</text><text x="737" y="318" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1b2d">de empresa</text><rect x="885" y="120" width="255" height="220" rx="20" fill="#fff" stroke="#fecaca" stroke-width="3"/><circle cx="1012" cy="198" r="50" fill="#fee2e2"/><text x="1012" y="216" text-anchor="middle" font-size="48" font-weight="400" fill="#0f1b2d">⚡</text>
  <circle cx="919" cy="154" r="20" fill="#dc2626"/><text x="919" y="163" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">4</text>
  <text x="1012" y="288" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1b2d">Te contratan</text><text x="1012" y="318" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1b2d">sin entrevista</text><rect x="60" y="370" width="255" height="220" rx="20" fill="#fff" stroke="#fecaca" stroke-width="3"/><circle cx="187" cy="448" r="50" fill="#fee2e2"/><text x="187" y="466" text-anchor="middle" font-size="48" font-weight="400" fill="#0f1b2d">🪪</text>
  <circle cx="94" cy="404" r="20" fill="#dc2626"/><text x="94" y="413" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">5</text>
  <text x="187" y="538" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1b2d">Piden datos</text><text x="187" y="568" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1b2d">sensibles</text><rect x="335" y="370" width="255" height="220" rx="20" fill="#fff" stroke="#fecaca" stroke-width="3"/><circle cx="462" cy="448" r="50" fill="#fee2e2"/><text x="462" y="466" text-anchor="middle" font-size="48" font-weight="400" fill="#0f1b2d">📍</text>
  <circle cx="369" cy="404" r="20" fill="#dc2626"/><text x="369" y="413" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">6</text>
  <text x="462" y="538" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1b2d">Cita en</text><text x="462" y="568" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1b2d">un lugar raro</text><rect x="610" y="370" width="255" height="220" rx="20" fill="#fff" stroke="#fecaca" stroke-width="3"/><circle cx="737" cy="448" r="50" fill="#fee2e2"/><text x="737" y="466" text-anchor="middle" font-size="48" font-weight="400" fill="#0f1b2d">⏰</text>
  <circle cx="644" cy="404" r="20" fill="#dc2626"/><text x="644" y="413" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">7</text>
  <text x="737" y="538" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1b2d">Te apuran</text><text x="737" y="568" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1b2d">a decidir</text><rect x="885" y="370" width="255" height="220" rx="20" fill="#fff" stroke="#fecaca" stroke-width="3"/><circle cx="1012" cy="448" r="50" fill="#fee2e2"/><text x="1012" y="466" text-anchor="middle" font-size="48" font-weight="400" fill="#0f1b2d">🔁</text>
  <circle cx="919" cy="404" r="20" fill="#dc2626"/><text x="919" y="413" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">8</text>
  <text x="1012" y="538" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1b2d">Invertir o</text><text x="1012" y="568" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1b2d">reclutar</text></svg>
