<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Prácticas preprofesionales: mientras estudias, máximo 6 horas diarias. Prácticas profesionales: después de egresar, máximo 8 horas diarias. En ambas, subvención no menor al sueldo mínimo con horario completo</title>
<rect width="1200" height="600" rx="28" fill="#eef3fb"/>
<text x="600" y="72" text-anchor="middle" font-size="40" font-weight="800" fill="#0b3d91">Dos tipos de prácticas</text>
<rect x="70" y="110" width="510" height="360" rx="20" fill="#fff" stroke="#d6e0f0" stroke-width="3"/><rect x="70" y="110" width="510" height="76" rx="20" fill="#1d5bbf"/><rect x="70" y="160" width="510" height="26" fill="#1d5bbf"/>
  <text x="325" y="162" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">Preprofesionales</text>
  <text x="130" y="252" text-anchor="middle" font-size="34" font-weight="400" fill="#0f1b2d">🎓</text><text x="170" y="252" text-anchor="start" font-size="28" font-weight="600" fill="#0f1b2d">Mientras estudias</text><text x="130" y="322" text-anchor="middle" font-size="34" font-weight="400" fill="#0f1b2d">⏰</text><text x="170" y="322" text-anchor="start" font-size="28" font-weight="600" fill="#0f1b2d">Máximo 6 h diarias</text><text x="130" y="392" text-anchor="middle" font-size="34" font-weight="400" fill="#0f1b2d">📅</text><text x="170" y="392" text-anchor="start" font-size="28" font-weight="600" fill="#0f1b2d">30 h a la semana</text><rect x="620" y="110" width="510" height="360" rx="20" fill="#fff" stroke="#d6e0f0" stroke-width="3"/><rect x="620" y="110" width="510" height="76" rx="20" fill="#f97316"/><rect x="620" y="160" width="510" height="26" fill="#f97316"/>
  <text x="875" y="162" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">Profesionales</text>
  <text x="680" y="252" text-anchor="middle" font-size="34" font-weight="400" fill="#0f1b2d">🎓</text><text x="720" y="252" text-anchor="start" font-size="28" font-weight="600" fill="#0f1b2d">Después de egresar</text><text x="680" y="322" text-anchor="middle" font-size="34" font-weight="400" fill="#0f1b2d">⏰</text><text x="720" y="322" text-anchor="start" font-size="28" font-weight="600" fill="#0f1b2d">Máximo 8 h diarias</text><text x="680" y="392" text-anchor="middle" font-size="34" font-weight="400" fill="#0f1b2d">📅</text><text x="720" y="392" text-anchor="start" font-size="28" font-weight="600" fill="#0f1b2d">Hasta 24 meses del egreso*</text>
<rect x="200" y="495" width="800" height="64" rx="20" fill="#dcfce7" stroke="none" stroke-width="3"/><text x="600" y="537" text-anchor="middle" font-size="28" font-weight="800" fill="#16a34a">Subvención: no menor al sueldo mínimo (S/ 1,230)</text>
<text x="1130" y="590" text-anchor="end" font-size="20" font-weight="500" fill="#5b6b82">*en el sector público</text></svg>
