<rect x="140" y="545" width="920" height="68" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/><text x="600" y="589" text-anchor="middle" font-size="26" font-weight="700" fill="#ea580c">¿Horario fijo, jefe y uniforme con recibo? Te corresponde planilla</text></svg>
