<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Comparación: en planilla tienes CTS, gratificaciones, vacaciones, EsSalud y boleta; con recibo por honorarios no. Si tienes horario fijo y jefe, corresponde planilla</title>
<rect width="1200" height="640" rx="28" fill="#eef3fb"/>
<text x="600" y="66" text-anchor="middle" font-size="38" font-weight="800" fill="#0b3d91">Planilla o recibo por honorarios</text>
<rect x="60" y="100" width="1080" height="420" rx="20" fill="#fff" stroke="#d6e0f0" stroke-width="3"/>
<text x="820" y="150" text-anchor="middle" font-size="30" font-weight="800" fill="#16a34a">Planilla</text><text x="1010" y="150" text-anchor="middle" font-size="30" font-weight="800" fill="#ea580c">Honorarios</text>
