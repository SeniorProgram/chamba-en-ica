<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Fórmula de la CTS: sueldo más asignación familiar más un sexto de la gratificación de julio, dividido entre 12 y multiplicado por los meses trabajados</title>
<rect width="1200" height="600" rx="28" fill="#eef3fb"/>
<text x="600" y="72" text-anchor="middle" font-size="40" font-weight="800" fill="#0b3d91">Cómo se calcula la CTS</text>
<rect x="60" y="120" width="300" height="150" rx="20" fill="#fff" stroke="#d6e0f0" stroke-width="3"/><text x="210" y="185" text-anchor="middle" font-size="28" font-weight="600" fill="#5b6b82">Sueldo de</text><text x="210" y="225" text-anchor="middle" font-size="32" font-weight="800" fill="#0f1b2d">octubre</text>
<text x="400" y="210" text-anchor="middle" font-size="56" font-weight="800" fill="#f97316">+</text>
<rect x="440" y="120" width="300" height="150" rx="20" fill="#fff" stroke="#d6e0f0" stroke-width="3"/><text x="590" y="185" text-anchor="middle" font-size="28" font-weight="600" fill="#5b6b82">Asignación</text><text x="590" y="225" text-anchor="middle" font-size="32" font-weight="800" fill="#0f1b2d">familiar*</text>
<text x="780" y="210" text-anchor="middle" font-size="56" font-weight="800" fill="#f97316">+</text>
<rect x="820" y="120" width="320" height="150" rx="20" fill="#fff" stroke="#d6e0f0" stroke-width="3"/><text x="980" y="185" text-anchor="middle" font-size="28" font-weight="600" fill="#5b6b82">1/6 de la</text><text x="980" y="225" text-anchor="middle" font-size="30" font-weight="800" fill="#0f1b2d">gratificación julio</text>
<path d="M600 290 v40" stroke="#0b3d91" stroke-width="8" stroke-linecap="round"/><path d="M582 322 l18 22 l18 -22" fill="none" stroke="#0b3d91" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="300" y="360" width="600" height="84" rx="20" fill="#0b3d91" stroke="none" stroke-width="3"/><text x="600" y="414" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">Remuneración computable</text>
<text x="600" y="500" text-anchor="middle" font-size="32" font-weight="700" fill="#0f1b2d">÷ 12 × meses completos del semestre</text>
<rect x="330" y="520" width="540" height="56" rx="20" fill="#dcfce7" stroke="none" stroke-width="3"/><text x="600" y="558" text-anchor="middle" font-size="28" font-weight="800" fill="#16a34a">Ej.: S/ 2,100 ÷ 12 × 6 = S/ 1,050</text>
<text x="1140" y="590" text-anchor="end" font-size="20" font-weight="500" fill="#5b6b82">*si tienes hijos menores</text></svg>
