<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Cómo ubicarte en una videollamada: luz de frente, cámara a la altura de los ojos y fondo ordenado</title>
<rect width="1200" height="560" rx="28" fill="#eef3fb"/>
<text x="600" y="66" text-anchor="middle" font-size="38" font-weight="800" fill="#0b3d91">Cómo ubicarte frente a la cámara</text>
<rect x="90" y="110" width="560" height="360" rx="20" fill="#fff" stroke="#d6e0f0" stroke-width="3"/>
<rect x="120" y="140" width="500" height="300" rx="14" fill="#e2e8f0"/>
<circle cx="370" cy="270" r="62" fill="#fcd9b6"/><path d="M308 262 q8 -80 66 -72 q56 8 54 72 q-44 -34 -120 0Z" fill="#3f2a1d"/>
<path d="M260 440 q0 -110 110 -110 q110 0 110 110Z" fill="#1d5bbf"/>
<line x1="120" y1="250" x2="620" y2="250" stroke="#f97316" stroke-width="3" stroke-dasharray="10 8"/>
<text x="612" y="240" text-anchor="end" font-size="20" font-weight="700" fill="#ea580c">ojos aquí</text>
<text x="720" y="170" text-anchor="middle" font-size="36" font-weight="400" fill="#0f1b2d">☀️</text><text x="770" y="158" text-anchor="start" font-size="27" font-weight="800" fill="#0f1b2d">Luz de frente</text><text x="770" y="192" text-anchor="start" font-size="23" font-weight="500" fill="#5b6b82">mirando a una ventana</text><text x="720" y="252" text-anchor="middle" font-size="36" font-weight="400" fill="#0f1b2d">📷</text><text x="770" y="240" text-anchor="start" font-size="27" font-weight="800" fill="#0f1b2d">Cámara a la altura</text><text x="770" y="274" text-anchor="start" font-size="23" font-weight="500" fill="#5b6b82">de tus ojos</text><text x="720" y="334" text-anchor="middle" font-size="36" font-weight="400" fill="#0f1b2d">🧱</text><text x="770" y="322" text-anchor="start" font-size="27" font-weight="800" fill="#0f1b2d">Fondo ordenado</text><text x="770" y="356" text-anchor="start" font-size="23" font-weight="500" fill="#5b6b82">y sin movimiento</text><text x="720" y="416" text-anchor="middle" font-size="36" font-weight="400" fill="#0f1b2d">🔇</text><text x="770" y="404" text-anchor="start" font-size="27" font-weight="800" fill="#0f1b2d">Lugar en silencio</text><text x="770" y="438" text-anchor="start" font-size="23" font-weight="500" fill="#5b6b82">avisa en casa</text></svg>
